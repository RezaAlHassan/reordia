800;padding:15px 22px}td{padding:17px 22px;border-top:1px solid #eff1f6;font-size:12px;color:#6d758b}td strong{color:#26304c}tr:hover td{background:#fbfbff}.initial{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:50%;margin-right:9px;background:#e8e3ff;color:#7563c9;font-weight:800;vertical-align:middle}.link{border:0;background:transparent;color:#6756ed;font-weight:800;font-size:12px}.rightstack{display:flex;flex-direction:column;gap:22px}.minirow{padding:16px 23px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eff1f5}.minirow:last-child{border:0}.prodname{font-size:12px;font-weight:800}.proddesc{font-size:11px;color:#9aa1b3;margin-top:5px}.roundicon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:#fff3ec;margin-right:12px}.mini-main{display:flex;align-items:center}.empty{padding:60px 20px;text-align:center;color:#9aa0b0}.toolbar{display:flex;gap:10px;margin-bottom:16px}.search{border:1px solid #e4e7f0;border-radius:8px;padding:12px 14px;background:white;min-width:270px;outline:0}.search:focus{border-color:#8275ef}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#20243a73;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;border-radius:15px;width:min(480px,100%);padding:26px;box-shadow:0 20px 90px #1e244a33}.modal h2{font:800 21px Manrope;margin:0 0 8px}.modal p{color:#8b93a7;font-size:13px;margin:0 0 22px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;border:1px solid #dfe3ed;border-radius:8px;color:#26304c;background:#fff}.modal-actions{display:flex;justify-content:end;gap:9px;margin-top:24px}.notice{background:#f0eeff;padding:13px 16px;border-radius:9px;color:#6656df;font-size:12px;line-height:1.6;margin:16px 0}.mobilemenu{display:none}.chart{height:200px;display:flex;align-items:end;justify-content:space-around;padding:20px 15px 10px;gap:15px}.barcol{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:12px;flex:1;font-size:10px;color:#9da4b3}.bar{width:100%;max-width:36px;border-radius:5px 5px 0 0;background:#ddd8ff}.bar.hot{background:#7362f5}.tabstrip{display:flex;gap:22px;border-bottom:1px solid #eff0f5;padding:0 24px}.tabstrip button{padding:15px 0;background:none;border:0;color:#9ca2b2;font-weight:700;font-size:12px}.tabstrip button.selected{border-bottom:2px solid #6554f5;color:#6554f5}@media(max-width:1120px){.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{width:210px}.content{padding:30px}.topbar{padding:0 30px}}@media(max-width:700px){.sidebar{position:fixed;z-index:20;transform:translateX(-100%);transition:.2s;width:245px;box-shadow:0 0 30px #0001}.sidebar.open{transform:none}.mobilemenu{display:block;border:0;background:none;font-size:22px}.topbar{height:64px;padding:0 18px}.content{padding:22px 15px}.heading{align-items:start;flex-direction:column}.heading h1{font-size:25px}.metrics{gap:9px}.metric{padding:15px;min-height:120px}.value{font-size:23px}.layout{gap:14px}.panel{overflow:auto}.panelhead{padding:18px}.topright span{display:none}.actions{width:100%}.actions .btn{flex:1;justify-content:center}th,td{padding:13px 12px;white-space:nowrap}.search{min-width:0;width:100%}}
</style></head><body><div id="app"></div><script>
const icon=(name)=>({grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',box:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13h12.8l2-9H6"/>',chart:'<path d="M3 3v18h18M7 16v-4M12 16V7M17 16v-8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l-1.8 1.8a1.7 1.7 0 0 0-1.9-.3l-.8.3v2.3h-2.5v-2.3l-.8-.3a1.7 1.7 0 0 0-1.9.3l-1.8-1.8a1.7 1.7 0 0 0 .3-1.9l-.3-.8H5.9v-2.5h2.3l.3-.8a1.7 1.7 0 0 0-.3-1.9l1.8-1.8a1.7 1.7 0 0 0 1.9.3l.8-.3V5h2.5v2.3l.8.3a1.7 1.7 0 0 0 1.9-.3l1.8 1.8a1.7 1.7 0 0 0-.3 1.9l.3.8H22v2.5h-2.3z"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 17v4h16v-4"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>'}[name]||'');const svg=n=>`<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${icon(n)}</svg>`;
const day=86400000;const iso=d=>new Date(d).toISOString().slice(0,10);const ago=n=>iso(Date.now()-n*day);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const defaults={products:[{id:1,name:'Premium Cat Food',variant:'2 kg bag',days:30,lead:3,price:1450,emoji:'🐈'},{id:2,name:'Clumping Cat Litter',variant:'5 L pack',days:25,lead:3,price:650,emoji:'🐾'},{id:3,name:'Kitten Dry Food',variant:'1 kg bag',days:18,lead:2,price:850,emoji:'🥣'}],customers:[{id:1,name:'Nadia Rahman',phone:'01711000001',channel:'Messenger',consent:true},{id:2,name:'Fahim Ahmed',phone:'01822000002',channel:'WhatsApp',consent:true},{id:3,name:'Sadia Islam',phone:'01933000003',channel:'Messenger',consent:true},{id:4,name:'Tanvir Hasan',phone:'01744000004',channel:'Messenger',consent:true},{id:5,name:'Maliha Chowdhury',phone:'01855000005',channel:'WhatsApp',consent:true}],orders:[{id:1,customerId:1,productId:1,date:ago(29),quantity:1},{id:2,customerId:2,productId:2,date:ago(24),quantity:1},{id:3,customerId:3,productId:3,date:ago(17),quantity:1},{id:4,customerId:4,productId:1,date:ago(13),quantity:1},{id:5,customerId:5,productId:2,date:ago(32),quantity:1}],reminders:[]};let state=JSON.parse(localStorage.getItem('refill-demo-state')||'null')||structuredClone(defaults);let view='Overview',modal='',filter='',mobile=false;const save=()=>localStorage.setItem('refill-demo-state',JSON.stringify(state));const prod=id=>state.products.find(p=>p.id==id),customer=id=>state.customers.find(c=>c.id==id);function rows(){return state.orders.map(o=>{const p=prod(o.productId),c=customer(o.customerId);if(!p||!c)return null;const due=new Date(o.date).getTime()+((p.days*o.quantity)-p.lead)*day;const status=state.reminders.find(r=>r.orderId===o.id);return {...o,p,c,due,daysLeft:Math.ceil((due-Date.now())/day),status}}).filter(Boolean).filter(o=>!state.orders.some(newer=>newer.id!==o.id&&newer.customerId===o.customerId&&newer.productId===o.productId&&new Date(newer.date)>new Date(o.date))).sort((a,b)=>a.due-b.due)}function status(o){if(o.status?.type==='sent')return ['Sent','green'];if(o.status?.type==='snoozed'&&new Date(o.status.until)>new Date())return ['Snoozed','gray'];if(o.daysLeft<=0)return ['Due now',''];if(o.daysLeft<=7)return ['Due soon','purple'];return ['Scheduled','gray']}function follow(o){const m=`Hi ${o.c.name.split(' ')[0]}! 👋 Your ${o.p.name} (${o.p.variant}) might be running low. Would you like to reorder from us? Reply here and we'll help you out.`;return m}function send(id){const o=rows().find(o=>o.id===id);if(!o)return;const m=follow(o);navigator.clipboard?.writeText(m).catch(()=>{});state.reminders=state.reminders.filter(r=>r.orderId!==id);state.reminders.push({orderId:id,type:'sent',date:iso(Date.now())});save();modal='message:'+id;render()}function snooze(id){state.reminders=state.reminders.filter(r=>r.orderId!==id);state.reminders.push({orderId:id,type:'snoozed',until:iso(Date.now()+7*day)});save();render()}const nav=['Overview','Customers','Products','Orders','Reminders','Analytics'];const navicons=['grid','users','box','cart','clock','chart'];function setView(v){view=v;filter='';mobile=false;render()}function openModal(m){modal=m;render()}function closeModal(){modal='';render()}function header(){const titles={Overview:['Good morning, Reza 👋','Here’s what’s happening with your repeat sales today.'],Customers:['Your customers','Keep track of everyone who shops with you.'],Products:['Product catalog','Set how often each product usually needs replenishing.'],Orders:['Purchase history','Each recorded sale powers the next follow-up.'],Reminders:['Replenishment reminders','Reach customers when their products may be running low.'],Analytics:['Repeat sales insights','Track follow-ups and confirmed repeat purchases.']};const [t,s]=titles[view];let buttons=view==='Overview'?`<button class="btn" onclick="openModal('import')">${svg('upload')} Import orders</button><button class="btn primary" onclick="openModal('order')">${svg('plus')} Add order</button>`:view==='Products'?`<button class="btn primary" onclick="openModal('product')">${svg('plus')} Add product</button>`:view==='Customers'?`<button class="btn primary" onclick="openModal('customer')">${svg('plus')} Add customer</button>`:view==='Orders'?`<button class="btn primary" onclick="openModal('order')">${svg('plus')} Add order</button>`:view==='Reminders'?`<button class="btn" onclick="openModal('settings')">${svg('settings')} Reminder settings</button>`:'';return `<div class="heading"><div><div class="eyebrow">${view==='Overview'?'Monday, 2 November 2026':'Your workspace'}</div><h1>${t}</h1><div class="sub">${s}</div></div><div class="actions">${buttons}</div></div>`}function metric(label,value,foot,ico){return `<div class="metric"><div class="metric-top">${label}<span class="metric-icon">${svg(ico)}</span></div><div class="value">${value}</div><span class="delta">${foot}</span></div>`}function remindersTable(limit){const list=rows().filter(o=>status(o)[0]!=='Sent'&&(!filter||`${o.c.name} ${o.p.name} ${o.c.phone}`.toLowerCase().includes(filter.toLowerCase())));return `<table><thead><tr><th>Customer</th><th>Product</th><th>Expected</th><th>Status</th><th>Action</th></tr></thead><tbody>${(limit?list.slice(0,limit):list).map(o=>`<tr><td><span class="initial">${esc(o.c.name[0])}</span><strong>${esc(o.c.name)}</strong></td><td>${esc(o.p.name)}<div class="muted">${esc(o.p.variant)}</div></td><td>${new Date(o.due).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</td><td><span class="pill ${status(o)[1]}">${status(o)[0]}</span></td><td><button class="link" onclick="openModal('message:${o.id}')">Prepare ↗</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No customers to show</td></tr>'}</tbody></table>`}function overview(){const r=rows(),due=r.filter(o=>o.daysLeft<=0&&status(o)[0]!=='Sent').length,sent=state.reminders.filter(r=>r.type==='sent').length,potential=r.filter(o=>o.daysLeft<=7).reduce((s,o)=>s+o.p.price*o.quantity,0);return `<div class="metrics">${metric('Customers due',due,'Ready for follow-up','users')}${metric('Upcoming reminders',r.filter(o=>o.daysLeft>0&&o.daysLeft<=7).length,'Within the next 7 days','clock')}${metric('Messages prepared',sent,'Recorded in this workspace','send')}${metric('Potential repeat sales',money(potential),'Estimated, not guaranteed','chart')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Customers to follow up</h2><p>Replenishment reminders based on purchase dates</p></div><button class="link" onclick="setView('Reminders')">View all →</button></div>${remindersTable(5)}</section><div class="rightstack"><section class="panel"><div class="panelhead"><div><h2>Your products</h2><p>Average replenishment cycle</p></div><button class="link" onclick="setView('Products')">Manage</button></div>${state.products.slice(0,4).map(p=>`<div class="minirow"><div class="mini-main"><div class="roundicon">${p.emoji||'📦'}</div><div><div class="prodname">${esc(p.name)}</div><div class="proddesc">${esc(p.variant)}</div></div></div><span class="pill purple">${p.days} days</span></div>`).join('')}</section><section class="panel"><div class="panelhead"><div><h2>How Refill works</h2><p>Your repeat-sales loop</p></div></div><div style="padding:22px;font-size:12px;color:#737d94;line-height:2.4">① Record each purchase<br>② We calculate a reminder date<br>③ Reach out to your customer<br>④ Record the next order<br><div class="notice">No AI prediction required. Your product intervals control the schedule.</div></div></section></div></div>`}function tablePage(type){let body='';if(type==='Customers')body=`<table><thead><tr><th>Customer</th><th>Phone</th><th>Channel</th><th>Orders</th><th>Consent</th></tr></thead><tbody>${state.customers.filter(c=>`${c.name} ${c.phone}`.toLowerCase().includes(filter.toLowerCase())).map(c=>`<tr><td><span class="initial">${esc(c.name[0])}</span><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${esc(c.channel)}</td><td>${state.orders.filter(o=>o.customerId===c.id).length}</td><td><span class="pill ${c.consent?'green':'gray'}">${c.consent?'Opted in':'Not opted in'}</span></td></tr>`).join('')}</tbody></table>`;if(type==='Products')body=`<table><thead><tr><th>Product</th><th>Price</th><th>Replenishment</th><th>Lead time</th><th>Action</th></tr></thead><tbody>${state.products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).map(p=>`<tr><td><strong>${p.emoji||'📦'} ${esc(p.name)}</strong><div class="muted">${esc(p.variant)}</div></td><td>${money(p.price)}</td><td><span class="pill purple">Every ${p.days} days</span></td><td>${p.lead} days before</td><td><button class="link" onclick="openModal('editproduct:${p.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`;if(type==='Orders')body=`<table><thead><tr><th>Customer</th><th>Product</th><th>Date</th><th>Quantity</th><th>Value</th></tr></thead><tbody>${[...state.orders].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(o=>`${customer(o.customerId)?.name} ${prod(o.productId)?.name}`.toLowerCase().includes(filter.toLowerCase())).map(o=>`<tr><td><strong>${esc(customer(o.customerId)?.name)}</strong></td><td>${esc(prod(o.productId)?.name)}</td><td>${esc(o.date)}</td><td>${o.quantity}</td><td>${money(o.quantity*prod(o.productId)?.price)}</td></tr>`).join('')}</tbody></table>`;if(type==='Reminders')body=remindersTable();return `<div class="toolbar"><input class="search" placeholder="Search ${type.toLowerCase()}..." value="${esc(filter)}" oninput="filter=this.value;document.querySelector('.panelbody').innerHTML=tableContent('${type}')"/></div><div class="panel"><div class="panelhead"><div><h2>${type==='Reminders'?'Follow-up queue':`All ${type.toLowerCase()}`}</h2><p>${type==='Reminders'?'Send a personalized reminder, or snooze until later':`${type==='Products'?state.products.length:type==='Customers'?state.customers.length:state.orders.length} records`}</p></div></div><div class="panelbody">${body}</div></div>`}window.tableContent=(t)=>{const f=filter;const el=document.createElement('div');el.innerHTML=tablePage(t);filter=f;return el.querySelector('.panelbody').innerHTML};function analytics(){const sent=state.reminders.filter(x=>x.type==='sent').length;const total=state.orders.reduce((s,o)=>s+(prod(o.productId)?.price||0)*o.quantity,0);return `<div class="metrics">${metric('Total recorded revenue',money(total),'Across imported and added orders','chart')}${metric('Orders recorded',state.orders.length,'All-time sample data','cart')}${metric('Follow-ups sent',sent,'Marked as sent','send')}${metric('Customers',state.customers.length,'In your customer list','users')}</div><div class="layout"><section class="panel"><div class="panelhead"><div><h2>Order activity</h2><p>Illustrative recent ordering pattern</p></div></div><div class="chart">${[32,54,42,75,58,91,69].map((h,i)=>`<div class="barcol"><div class="bar ${i===5?'hot':''}" style="height:${h}%"></div>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div>`).join('')}</div></section><section class="panel"><div class="panelhead"><h2>Measurement note</h2></div><div style="padding:23px;font-size:13px;color:#7c859b;line-height:1.8">Revenue attributed to reminders requires confirmed repeat orders and, ideally, a comparison group. This MVP does not claim incremental revenue automatically.</div></section></div>`}function modalHtml(){if(!modal)return '';const [kind,id]=modal.split(':');let title='',desc='',fields='';if(kind==='customer'){title='Add customer';desc='Create a customer record and capture messaging consent.';fields=`${field('Full name','name','text','e.g. Nusrat Jahan')}${field('Phone number','phone','tel','01XXXXXXXXX')}<div class="field"><label>Preferred channel</label><select name="channel"><option>Messenger</option><option>WhatsApp</option><option>Phone</option></select></div><label style="font-size:12px"><input type="checkbox" name="consent" style="width:auto"> Customer agreed to receive reorder reminders</label>`}if(kind==='product'||kind==='editproduct'){const p=kind==='editproduct'?prod(Number(id)):null;title=p?'Edit product':'Add product';desc='Configure the average time before another purchase.';fields=`${field('Product name','name','text','Product name',p?.name)}${field('Variant / pack size','variant','text','e.g. 2 kg bag',p?.variant)}<div class="field"><label>Average replenishment (days)</label><input type="number" min="1" name="days" value="${p?.days||30}" required></div><div class="field"><label>Remind this many days early</label><input type="number" min="0" name="lead" value="${p?.lead??3}" required></div>${field('Price (BDT)','price','number','Price',p?.price||'')}`;}if(kind==='order'){title='Record an order';desc='This automatically calculates the customer’s next reminder.';fields=`<div class="field"><label>Customer</label><select name="customerId" required>${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="productId" required>${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.variant)}</option>`).join('')}</select></div>${field('Purchase date','date','date','',iso(Date.now()))}<div class="field"><label>Quantity</label><input type="number" name="quantity" min="1" value="1" required></div>`}if(kind==='message'){const o=rows().find(r=>r.id===Number(id));if(!o)return '';title='Prepare reminder';desc=`${o.c.name} · ${o.c.channel}`;fields=`<div class="notice" style="color:#4c5673;background:#f7f7fc;white-space:pre-wrap">${esc(follow(o))}</div><p>Sending is not automated. Copy the message and send it through an authorized merchant channel. Only contact customers who opted in.</p><button type="button" class="btn" onclick="snooze(${id});closeModal()">Snooze 7 days</button>`}if(kind==='import'){title='Import orders';desc='Upload a CSV with customer, phone, product, purchase date, quantity and consent.';fields=`<div class="notice">CSV columns: customer, phone, product, date (YYYY-MM-DD), quantity, consent (yes/no). Products must match catalog names.</div><div class="field"><label>CSV file</label><input type="file" id="csv" accept=".csv,text/csv"></div>`}if(kind==='settings'){title='Reminder rules';desc='The MVP uses merchant-defined timing.';fields='<div class="notice">Each order schedules a reminder at purchase date + (replenishment days × quantity) − lead days. Editing a product updates future calculations. Sent reminders and opt-outs are respected.</div>'}return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><p>${desc}</p><form onsubmit="submitModal(event,'${kind}',${Number(id)||0})">${fields}<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${!['settings'].includes(kind)?`<button class="btn primary" type="submit">${kind==='message'?'Copy & mark sent':kind==='import'?'Import CSV':'Save'}</button>`:''}</div></form></div></div>`}function field(label,name,type,placeholder,value=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${name==='price'?'min="0"':''} required></div>`}function csvParse(text){const lines=text.trim().split(/\r?\n/);const parse=l=>{let a=[],v='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};let keys=parse(lines.shift()).map(x=>x.toLowerCase().trim());return lines.map(l=>Object.fromEntries(parse(l).map((v,i)=>[keys[i],v.trim()])))}window.submitModal=async(e,kind,id)=>{e.preventDefault();const f=e.target,d=new FormData(f);if(kind==='customer'){state.customers.push({id:Date.now(),name:d.get('name'),phone:d.get('phone'),channel:d.get('channel'),consent:d.has('consent')})}if(kind==='product'||kind==='editproduct'){const obj={id:kind==='editproduct'?id:Date.now(),name:d.get('name'),variant:d.get('variant'),days:+d.get('days'),lead:+d.get('lead'),price:+d.get('price'),emoji:'📦'};if(obj.lead>=obj.days){alert('Lead time must be shorter than replenishment interval');return}if(kind==='editproduct')state.products=state.products.map(p=>p.id===id?{...p,...obj}:p);else state.products.push(obj)}if(kind==='order'){state.orders.push({id:Date.now(),customerId:+d.get('customerId'),productId:+d.get('productId'),date:d.get('date'),quantity:+d.get('quantity')})}if(kind==='message'){const o=rows().find(o=>o.id===id);if(!o.c.consent){alert('This customer has not opted in to reminders.');return}await navigator.clipboard?.writeText(follow(o));state.reminders=state.reminders.filter(x=>x.orderId!==id);state.reminders.push({orderId:id,type:'sent',date:iso(Date.now())});alert('Message copied. Marked as sent for this demo; please send it manually.')}if(kind==='import'){const file=document.getElementById('csv').files[0];if(!file){alert('Choose a CSV file');return}const entries=csvParse(await file.text());let count=0;for(const x of entries){const p=state.products.find(p=>p.name.toLowerCase()===String(x.product||'').toLowerCase());if(!p||!x.customer||!x.phone||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||''))continue;let c=state.customers.find(c=>c.phone===x.phone);if(!c){c={id:Date.now()+count,name:x.customer,phone:x.phone,channel:'Messenger',consent:/^(yes|true|1)$/i.test(x.consent||'')};state.customers.push(c)}state.orders.push({id:Date.now()+1000+count,customerId:c.id,productId:p.id,date:x.date,quantity:Math.max(1,+x.quantity||1)});count++}alert(`Imported ${count} orders. Rows with unmatched products or invalid dates were skipped.`)}save();closeModal()};function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar ${mobile?'open':''}"><div class="brand"><span class="mark">↻</span> refill<span style="color:#7665ec">.</span></div><div class="navlabel">Workspace</div>${nav.map((n,i)=>`<button class="nav ${n===view?'active':''}" onclick="setView('${n}')">${svg(navicons[i])}${n}</button>`).join('')}<div style="margin-top:25px" class="navlabel">Account</div><button class="nav" onclick="openModal('settings')">${svg('settings')} Settings</button><div class="sidebottom"><div class="profile"><span class="avatar">R</span><div><strong>Reza's Pet Store</strong><br><small>Demo workspace</small></div></div></div></aside><main class="main"><div class="topbar"><div style="display:flex;align-items:center;gap:14px"><button class="mobilemenu" onclick="mobile=!mobile;render()">☰</button><span class="crumb">Workspace &nbsp;/&nbsp; <strong>${view}</strong></span></div><div class="topright"><span>Demo data · saved in this browser</span>${svg('bell')}<span class="circle">R</span></div></div><div class="content">${header()}${view==='Overview'?overview():view==='Analytics'?analytics():tablePage(view)}</div></main></div>${modalHtml()}`};render();
</script><a href="/api/meta/connect" style="position:fixed;right:22px;bottom:20px;z-index:15;background:#1877f2;color:white;text-decoration:none;padding:13px 18px;border-radius:9px;font:700 12px DM Sans, sans-serif;box-shadow:0 7px 25px #15244a22">Connect Facebook Page →</a></body></html>
